name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g., v1.6.2)"
        required: true
        default: "v1.6.2"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Backend executable
        working-directory: backend
        run: |
          pyinstaller aniways-backend.spec --clean
          dir dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        run: npm run build

      - name: Copy static files to standalone
        working-directory: frontend
        shell: pwsh
        run: |
          # Copy static folder to standalone
          if (Test-Path ".next/static") {
            New-Item -ItemType Directory -Force -Path ".next/standalone/.next/static"
            Copy-Item -Recurse -Force ".next/static/*" ".next/standalone/.next/static/"
          }

          # Copy public folder to standalone
          if (Test-Path "public") {
            New-Item -ItemType Directory -Force -Path ".next/standalone/public"
            Copy-Item -Recurse -Force "public/*" ".next/standalone/public/"
          }

      - name: Copy backend executable to desktop folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/backend-dist"
          Copy-Item -Force "backend/dist/aniways-backend.exe" "desktop/backend-dist/"
          dir desktop/backend-dist

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Electron app for Windows
        working-directory: desktop
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List output files
        working-directory: desktop
        shell: pwsh
        run: |
          Write-Host "Contents of dist:"
          Get-ChildItem -Recurse dist -Include *.exe | ForEach-Object { Write-Host $_.FullName }

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aniways-Windows-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Download Windows Setup artifact
        uses: actions/download-artifact@v4
        with:
          name: Aniways-Windows-Setup
          path: ./artifacts

      - name: List artifacts
        run: |
          echo "Artifacts:"
          ls -la ./artifacts/

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Aniways ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          generate_release_notes: true
          files: ./artifacts/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
